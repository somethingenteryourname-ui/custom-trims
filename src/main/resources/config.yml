# =========================================================
#  CustomTrims config
#  After editing, run /ctrim reload
# =========================================================

# How often particles are drawn, in ticks (20 ticks = 1 second).
# 1 = smoothest, 2 = good balance, 3-4 = lighter on big servers.
tick-interval: 2

# How many armor pieces need a custom trim before effects show (1-4).
min-armor-pieces: 1

# Only draw the trail while the player is moving.
trail-only-when-moving: true

# Hide effects for players who have the Invisibility potion effect.
hide-when-invisible: true

# Hide effects while sneaking.
hide-when-sneaking: false

# Limits for /ctrim size and /ctrim density
max-size: 3.0
max-density: 3.0

# ---------------------------------------------------------
# Presets: /ctrim preset <name>   or   /ctrim give <player> <name>
#
#  pattern:   bolt coast dune eye flow host raiser rib sentry shaper
#             silence snout spire tide vex ward wayfinder wild  (or none)
#  material:  amethyst copper diamond emerald gold iron lapis
#             netherite quartz redstone resin
#  colors:    names (red, aqua, pink...) or hex (#FF00AA)
#  trail / aura-particle: see /ctrim options
#  trail-shape: stream comet double spiral sparks cloud footsteps
#  aura:      none ring double_ring halo helix double_helix orbit
#             pulse crown tornado wings fireflies
# ---------------------------------------------------------
presets:
  inferno:
    name: Inferno
    pattern: rib
    material: gold
    colors: ["#FF3D00", "#FFC400"]
    trail: flame
    trail-shape: comet
    aura: tornado
    aura-particle: gradient
